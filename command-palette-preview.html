<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>South Plus +++ 全局命令面板预览</title>
  <style>
    :root {
      --spx-page-bg: #eef2f6;
      --spx-panel: #fff;
      --spx-panel-muted: #f7f9fc;
      --spx-line: #d7dee9;
      --spx-line-soft: #e5eaf2;
      --spx-text: #1f2937;
      --spx-strong: #182230;
      --spx-sub: #667085;
      --spx-muted: #98a2b3;
      --spx-link: #1d4ed8;
      --spx-accent: #2563eb;
      --spx-accent-soft: #dbeafe;
      --spx-accent-wash: #eff6ff;
      --spx-shadow-popover: 0 18px 48px rgba(15, 23, 42, .24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--spx-page-bg);
      color: var(--spx-text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .site-shell {
      min-height: 100vh;
      padding: 34px 24px;
    }

    .site-frame {
      position: relative;
      max-width: 1240px;
      min-height: 720px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--spx-line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(15, 23, 42, .14);
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 60px;
      padding: 0 24px;
      border-bottom: 1px solid var(--spx-line-soft);
      background: linear-gradient(180deg, #fff, #f8fafc);
    }

    .brand {
      color: var(--spx-strong);
      font-size: 16px;
      font-weight: 900;
    }

    .nav {
      display: flex;
      gap: 10px;
      color: var(--spx-sub);
      font-weight: 850;
    }

    .content {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 22px;
      padding: 22px;
      filter: blur(2px);
      opacity: .58;
    }

    .rail,
    .thread-list {
      border: 1px solid var(--spx-line);
      border-radius: 14px;
      background: var(--spx-panel);
      box-shadow: 0 8px 24px rgba(15, 23, 42, .06);
    }

    .rail { padding: 14px; }

    .rail h2,
    .thread-list h2 {
      margin: 0 0 12px;
      color: var(--spx-strong);
      font-size: 15px;
    }

    .rail-item,
    .thread-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      border-top: 1px solid var(--spx-line-soft);
      color: var(--spx-sub);
      font-weight: 850;
    }

    .thread-list { padding: 14px; }

    .thread-title {
      min-width: 0;
      overflow: hidden;
      color: var(--spx-strong);
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thread-meta { flex: none; color: var(--spx-sub); }

    .toolbar {
      position: absolute;
      right: 14px;
      bottom: 18px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 6px;
      border: 1px solid rgba(203, 213, 225, .8);
      border-radius: 16px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 18px 46px rgba(15, 23, 42, .18);
      backdrop-filter: blur(10px);
    }

    .toolbar button {
      width: 52px;
      height: 36px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #fff;
      color: var(--spx-text);
      font-size: 13px;
      font-weight: 900;
    }

    .toolbar .active {
      border-color: var(--spx-accent);
      background: var(--spx-accent-soft);
      color: var(--spx-accent);
    }

    .spx-command-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 72px 24px 28px;
      background: rgba(15, 23, 42, .28);
      backdrop-filter: blur(3px);
    }

    .spx-command-wrap {
      display: grid;
      grid-template-columns: minmax(0, 720px) minmax(220px, 300px);
      gap: 12px;
      width: min(1032px, calc(100vw - 72px));
      align-items: start;
    }

    .spx-command-palette,
    .spx-command-detail {
      overflow: hidden;
      border: 1px solid var(--spx-line);
      border-radius: 14px;
      background: var(--spx-panel);
      box-shadow: var(--spx-shadow-popover);
    }

    .spx-command-palette {
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 112px);
    }

    .spx-command-head {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--spx-line-soft);
      background: linear-gradient(180deg, #fff 0%, #f8fafc 100%);
    }

    .spx-command-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .spx-command-title strong {
      display: block;
      color: var(--spx-strong);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
    }

    .spx-command-title span {
      color: var(--spx-sub);
      font-size: 12px;
      font-weight: 900;
    }

    .spx-command-close {
      width: 30px;
      height: 30px;
      border: 1px solid var(--spx-line);
      border-radius: 9px;
      background: var(--spx-panel);
      color: var(--spx-sub);
      font-size: 16px;
      font-weight: 900;
    }

    .spx-command-search-wrap { position: relative; }

    .spx-command-search {
      width: 100%;
      height: 42px;
      padding: 0 42px 0 14px;
      border: 1px solid var(--spx-line);
      border-radius: 9px;
      background: #fff;
      color: var(--spx-text);
      font-size: 15px;
      font-weight: 850;
      outline: none;
    }

    .spx-command-search:focus {
      border-color: var(--spx-accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    .spx-command-search-mark {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--spx-muted);
      font-size: 13px;
      font-weight: 900;
    }

    .spx-command-tabs {
      display: flex;
      gap: 7px;
      min-width: 0;
      overflow-x: auto;
    }

    .spx-command-tab {
      flex: none;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--spx-line);
      border-radius: 999px;
      background: var(--spx-panel);
      color: var(--spx-sub);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .spx-command-tab.active {
      border-color: var(--spx-accent);
      background: var(--spx-accent-wash);
      color: var(--spx-accent);
    }

    .spx-command-list {
      display: grid;
      flex: 1 1 auto;
      min-height: 0;
      max-height: min(56vh, 474px);
      overflow: auto;
      padding: 10px;
    }

    .spx-command-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 64px;
      width: 100%;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--spx-text);
      text-align: left;
      cursor: pointer;
    }

    .spx-command-item.active,
    .spx-command-item:hover {
      border-color: var(--spx-line);
      background: var(--spx-panel-muted);
    }

    .spx-command-item.active { box-shadow: inset 3px 0 0 var(--spx-accent); }

    .spx-command-icon {
      display: inline-flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--spx-line);
      border-radius: 10px;
      background: #fff;
      color: var(--spx-accent);
      font-weight: 900;
    }

    .spx-command-main { min-width: 0; }

    .spx-command-main strong,
    .spx-command-main span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spx-command-main strong {
      color: var(--spx-strong);
      font-size: 14px;
      font-weight: 900;
    }

    .spx-command-main span {
      margin-top: 3px;
      color: var(--spx-sub);
      font-size: 12px;
      font-weight: 750;
    }

    .spx-command-tail {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--spx-muted);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .spx-command-pill,
    .spx-command-kbd {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--spx-accent-wash);
      color: var(--spx-accent);
      font-size: 11px;
      font-weight: 900;
    }

    .spx-command-kbd {
      min-width: 34px;
      height: 20px;
      border: 1px solid var(--spx-line);
      border-radius: 6px;
      background: #fff;
      color: var(--spx-sub);
    }

    .spx-command-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 14px;
      border-top: 1px solid var(--spx-line-soft);
      background: var(--spx-panel-muted);
      color: var(--spx-sub);
      font-size: 12px;
      font-weight: 850;
    }

    .spx-command-keys { display: flex; flex-wrap: wrap; gap: 6px; }

    .spx-command-detail { padding: 14px; }

    .spx-command-detail h3 {
      margin: 0;
      color: var(--spx-strong);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.3;
    }

    .spx-command-detail p {
      margin: 5px 0 12px;
      color: var(--spx-sub);
      font-size: 12px;
      font-weight: 750;
    }

    .spx-command-detail-card {
      display: grid;
      gap: 9px;
      padding: 11px;
      border: 1px solid var(--spx-line-soft);
      border-radius: 12px;
      background: var(--spx-panel-muted);
    }

    .spx-command-detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 26px;
      color: var(--spx-text);
      font-size: 12px;
      font-weight: 850;
    }

    .spx-command-detail-row span:first-child { flex: none; color: var(--spx-sub); }

    .spx-command-detail-row strong,
    .spx-command-detail-row a {
      min-width: 0;
      overflow: hidden;
      color: inherit;
      font-weight: 900;
      text-align: right;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spx-command-detail-target { align-items: flex-start; }

    .spx-command-detail-target strong,
    .spx-command-detail-target a {
      overflow: visible;
      color: var(--spx-link);
      line-height: 1.35;
      text-align: left;
      overflow-wrap: anywhere;
      white-space: normal;
      word-break: break-word;
    }

    @media (max-width: 980px) {
      .spx-command-wrap { grid-template-columns: 1fr; width: min(720px, calc(100vw - 52px)); }
      .spx-command-detail { display: none; }
    }

    @media (max-width: 760px) {
      .site-shell { padding: 0; }
      .site-frame { min-height: 100vh; border-radius: 0; }
      .content { grid-template-columns: 1fr; padding: 14px; }
      .rail { display: none; }
      .toolbar { left: 8px; right: 8px; bottom: 18px; flex-direction: row; justify-content: space-between; }
      .toolbar button { flex: 1; width: auto; }
      .spx-command-overlay { padding: 58px 8px 20px; }
      .spx-command-wrap { width: calc(100vw - 16px); }
      .spx-command-palette { max-height: calc(100vh - 78px); }
      .spx-command-list { max-height: none; }
      .spx-command-item { grid-template-columns: 34px minmax(0, 1fr); min-height: 62px; }
      .spx-command-icon { width: 34px; height: 34px; }
      .spx-command-tail { grid-column: 2; justify-content: flex-start; }
      .spx-command-foot { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>

  <script>
    (function initCommandPreview() {
      var search = document.getElementById('commandSearch');
      var list = document.getElementById('commandList');
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.spx-command-tab'));
      var items = Array.prototype.slice.call(document.querySelectorAll('.spx-command-item'));
      var summary = document.getElementById('resultSummary');
      var activeFilter = 'all';
      var composing = false;

      function text(item) { return item.textContent.toLowerCase(); }
      function visibleItems() { return items.filter(function visible(item) { return item.style.display !== 'none'; }); }
      function setTarget(value) {
        var holder = document.getElementById('detailTarget');
        var parent = holder.parentNode;
        var next = /^https?:/i.test(value) ? document.createElement('a') : document.createElement('strong');
        next.id = 'detailTarget';
        next.textContent = value || '-';
        if (next.tagName === 'A') {
          next.href = value;
          next.target = '_blank';
          next.rel = 'noopener noreferrer';
        }
        parent.replaceChild(next, holder);
      }
      function setActive(item) {
        items.forEach(function clear(node) { node.classList.toggle('active', node === item); });
        if (!item) return;
        document.getElementById('detailTitle').textContent = item.dataset.title || '';
        document.getElementById('detailDesc').textContent = item.dataset.desc || '';
        document.getElementById('detailSource').textContent = item.dataset.source || '-';
        document.getElementById('detailRisk').textContent = item.dataset.risk || '低';
        setTarget(item.dataset.target || '-');
      }
      function render() {
        var query = String(search.value || '').trim().toLowerCase();
        var count = 0;
        items.forEach(function filter(item) {
          var show = (activeFilter === 'all' || item.dataset.kind === activeFilter) && (!query || text(item).indexOf(query) >= 0);
          item.style.display = show ? '' : 'none';
          if (show) count += 1;
        });
        var visible = visibleItems();
        if (!visible.some(function active(item) { return item.classList.contains('active'); })) setActive(visible[0]);
        summary.textContent = (activeFilter === 'all' ? '全部命令' : tabs.filter(function tab(node) { return node.dataset.filter === activeFilter; })[0].textContent) + ' · ' + count + ' / ' + items.length + ' 项';
      }
      tabs.forEach(function bindTab(tab) {
        tab.addEventListener('click', function clickTab() {
          activeFilter = tab.dataset.filter || 'all';
          tabs.forEach(function clear(node) { node.classList.toggle('active', node === tab); });
          items.forEach(function clear(item) { item.classList.remove('active'); });
          render();
          search.focus();
        });
      });
      items.forEach(function bindItem(item) { item.addEventListener('click', function clickItem() { setActive(item); }); });
      search.addEventListener('compositionstart', function start() { composing = true; });
      search.addEventListener('compositionend', function end() { composing = false; render(); });
      search.addEventListener('input', function input(event) { if (!composing && !event.isComposing) render(); });
      search.addEventListener('keydown', function keydown(event) {
        if (composing || event.isComposing || event.keyCode === 229) return;
        var visible = visibleItems();
        var index = visible.findIndex(function current(item) { return item.classList.contains('active'); });
        if (event.key === 'ArrowDown') { event.preventDefault(); setActive(visible[Math.min(visible.length - 1, index + 1)] || visible[0]); }
        if (event.key === 'ArrowUp') { event.preventDefault(); setActive(visible[Math.max(0, index - 1)] || visible[0]); }
      });
      render();
      search.focus();
      search.setSelectionRange(search.value.length, search.value.length);
    })();
  </script>
</body>
</html>
